# The three legacy CH4 profile scripts as variants (former ch4_profile.jl, CH4_isotherm_test.jl,
# CH4_isobar_test.jl, with the fixes of their v0.2 hand-port):
#   35 layers 0–10 km, p(z) = 1000 hPa exp(−z / 8.5 km), T(z) = 270 K − 6.5 K/km z,
#   H2O 0.005 → 0.001, CH4 2000 → 1900 ppb, CO2 410 → 400 ppm; HITRAN 2020 H2O and CO2,
#   HITRAN 2008 CH4, line-by-line; log space; noise SNR 2000 on the mean intensity.
#   profile:  prior correlated in pressure (50 hPa for CH4 and CO2), γ 40
#   isotherm: every layer at the column-weighted mean T, diagonal prior, γ 80
#   isobar:   every layer at the column-weighted mean p, prior correlated in profile pressure, γ 75
# Fixes kept from the hand-port (v0.1 isotherm/isobar were not comparable with the profile case):
# H2O profile 0.005 → 0.001 in every case (v0.1 reversed it), isobar H2O prior 0.005 (was 0.05),
# noise σ = mean intensity / SNR (v0.1 divided by the log-space signal), line-by-line everywhere.
#
#   julia --project=../../SpectralFit.jl ../../SpectralFit.jl/bin/run_config.jl configs/legacy_ch4.toml [profile|isotherm|isobar]

extends = "base.toml"
experiment = "legacy_ch4"
target = "CH4"
window_cm = [6050.0, 6120.0]
measurement_space = "log"

[noise]
source = "snr"
snr = 2000.0

[atmosphere]
n_layers = 35
top_m = 10000.0
pressure = { kind = "exponential", surface_hPa = 1000.0, scale_height_m = 8500.0 }
temperature = { kind = "lapse_rate", surface_K = 270.0, lapse_K_per_m = 0.0065 }
layer_columns = "ideal_gas"
mode = "profile"

[prior]
correlation_coordinate = "pressure_hPa"

[solver]
initial_damping = 40.0

[gases.H2O]
truth = { kind = "linear", bottom = 0.005, top = 0.001 }
prior = 0.005
sigma = 0.01
correlation_length = 0.01         # hPa: uncorrelated
cross_section = { file = "../../spectra/hit20_H2O.par", molecule = 1, range_cm = [6050.0, 6120.0] }

[gases.CH4]
truth = { kind = "linear", bottom = 2000e-9, top = 1900e-9 }
prior = 1950e-9
sigma = 500e-9
correlation_length = 50.0         # hPa
cross_section = { file = "../../spectra/hit08_12CH4.par", molecule = 6, range_cm = [6050.0, 6120.0] }

[gases.CO2]
truth = { kind = "linear", bottom = 410e-6, top = 400e-6 }
prior = 405e-6
sigma = 100e-6
correlation_length = 50.0         # hPa
cross_section = { file = "../../spectra/hit20_12CO2.par", molecule = 2, range_cm = [6050.0, 6120.0] }

[[variants]]
name = "profile"

[[variants]]
name = "isotherm"
atmosphere.mode = "isotherm"
prior.correlation_coordinate = "none"
solver.initial_damping = 80.0

[[variants]]
name = "isobar"
atmosphere.mode = "isobar"
solver.initial_damping = 75.0
