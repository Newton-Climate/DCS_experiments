# CO2 window on the US Standard atmosphere (former run_profiles.jl, species CO2).
#   profile:  full T(z) and p(z)
#   isotherm: every layer at the column-weighted mean T; p(z) kept
#   isobar:   every layer at the column-weighted mean p; T(z) kept
# *_tables variants use the cross-section tables of make_profile_tables.jl (fast).
#
#   julia --project=../../SpectralFit.jl ../../SpectralFit.jl/bin/run_config.jl configs/us_standard_co2.toml [variant ...]

extends = "us_standard.toml"
experiment = "us_standard_co2"
target = "CO2"
window_cm = [6180.0, 6260.0]
measurement_space = "linear"

[solver]
initial_damping = 50.0

# Cross sections are set in each variant: a variant's tables are merged into the file's,
# so a lookup-table spec ({ file }) cannot replace a line-list spec ({ file, molecule, range_cm }).

[[variants]]
name = "profile"
gases.H2O.cross_section = { file = "../../spectra/hit20_H2O.par", molecule = 1, range_cm = [6180.0, 6260.0] }
gases.CO2.cross_section = { file = "../../spectra/hit20_12CO2.par", molecule = 2, range_cm = [6180.0, 6260.0] }

[[variants]]
name = "isotherm"
atmosphere.mode = "isotherm"
gases.H2O.cross_section = { file = "../../spectra/hit20_H2O.par", molecule = 1, range_cm = [6180.0, 6260.0] }
gases.CO2.cross_section = { file = "../../spectra/hit20_12CO2.par", molecule = 2, range_cm = [6180.0, 6260.0] }

[[variants]]
name = "isobar"
atmosphere.mode = "isobar"
gases.H2O.cross_section = { file = "../../spectra/hit20_H2O.par", molecule = 1, range_cm = [6180.0, 6260.0] }
gases.CO2.cross_section = { file = "../../spectra/hit20_12CO2.par", molecule = 2, range_cm = [6180.0, 6260.0] }

[[variants]]
name = "profile_tables"
gases.H2O.cross_section = { file = "../../spectra/profile_tables/CO2_H2O.jld2" }
gases.CO2.cross_section = { file = "../../spectra/profile_tables/CO2_CO2.jld2" }

[[variants]]
name = "isotherm_tables"
atmosphere.mode = "isotherm"
gases.H2O.cross_section = { file = "../../spectra/profile_tables/CO2_H2O.jld2" }
gases.CO2.cross_section = { file = "../../spectra/profile_tables/CO2_CO2.jld2" }

[[variants]]
name = "isobar_tables"
atmosphere.mode = "isobar"
gases.H2O.cross_section = { file = "../../spectra/profile_tables/CO2_H2O.jld2" }
gases.CO2.cross_section = { file = "../../spectra/profile_tables/CO2_CO2.jld2" }
